<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLUP Games - Mines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f121a;
    --panel: #181c27;
    --panel-light: #1e2433;
    --text: #ffffff;
    --muted: #7785b3;
    --accent: #3d8aff;
    --line: #2a3347;
    --green: #4bff8d;
    --red: #ff4b4b;
    --yellow: #ffb84b;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 15px; }

  /* --- ХЕДЕР --- */
  .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 12px; }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 900; color:#fff; text-decoration:none; }
  .title { font-size: 18px; font-weight: 800; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .balance { background: var(--panel-light); padding: 8px 16px; border-radius: 10px; font-weight: 700; border: 1px solid var(--line); }
  .balance span { color: var(--accent); }
  .btn-back { background: var(--panel-light); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: 0.2s; }
  .btn-back:hover { background: var(--line); }

  /* --- ЛОББИ --- */
  .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .nav-tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .nav-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .panel-content { display: none; background: var(--panel); border-radius: 16px; border: 1px solid var(--line); padding: 30px; }
  .panel-content.active { display: block; }

  .game-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .game-card { background: var(--panel-light); border: 1px solid var(--line); border-radius: 16px; padding: 20px; text-align: center; text-decoration: none; color: #fff; transition: 0.2s; }
  .game-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game-card h2 { font-size: 24px; margin-bottom: 10px; color: var(--accent); }
  .game-card p { font-size: 12px; color: var(--muted); }

  .form-box { max-width: 400px; margin: 0 auto; }
  .form-box input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: #fff; padding: 15px; border-radius: 10px; font-size: 16px; margin-bottom: 15px; outline: none; }
  .form-box button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
  .form-box p { margin-top: 15px; text-align: center; font-weight: 600; }

  /* --- ИГРА MINES --- */
  .game-board { display: none; }
  .game-board.active { display: block; }

  .mines-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }

  /* Левая панель */
  .mines-sidebar { display: flex; flex-direction: column; gap: 15px; }
  .side-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .side-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  
  .mine-selector { display: flex; gap: 8px; }
  .mine-btn { flex: 1; background: var(--panel-light); border: 1px solid var(--line); color: #fff; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .mine-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  .mine-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .bet-input-box { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bet-input-box span { color: var(--yellow); font-size: 18px; }
  .bet-input-box input { flex: 1; background: var(--bg); border: 1px solid var(--line); color: #fff; padding: 10px; border-radius: 8px; font-size: 16px; font-weight: 800; outline: none; }
  .bet-quick { display: flex; gap: 5px; }
  .bet-quick button { flex: 1; background: var(--panel-light); border: 1px solid var(--line); color: var(--muted); padding: 5px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .bet-quick button:hover { color: #fff; }

  .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  
  /* Кнопка Играть/Забрать */
  .btn-main-action { 
    background: var(--accent); 
    color: #fff; 
    border: none; 
    padding: 15px; 
    border-radius: 10px; 
    font-weight: 800; 
    font-size: 16px; 
    cursor: pointer; 
    transition: 0.2s; 
  }
  .btn-main-action:hover { background: #2b7bf3; }
  .btn-main-action.take { background: var(--green); color: #000; }
  .btn-main-action.take:hover { background: #38e078; }
  .btn-main-action:disabled { background: var(--panel-light); color: var(--muted); cursor: not-allowed; }

  .btn-auto { background: var(--yellow); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
  .btn-auto:hover { background: #e5a542; }
  .btn-auto:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Правая панель - Сетка */
  .mines-grid-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .grid-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 30px;
  }

  .cell {
    width: 80px;
    height: 80px;
    background: var(--panel-light);
    border-radius: 12px;
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    transition: 0.1s;
    user-select: none;
  }
  .cell:hover:not(.opened):not(.disabled) {
    background: #2a344a;
  }
  .cell.opened { background: #0f121a; cursor: default; }
  .cell.bomb { background: #3a1c1c; border-color: var(--red); }
  .cell.crown { background: #1c3a24; border-color: var(--green); }
  .cell.disabled { opacity: 0.5; cursor: not-allowed; }

  /* Нижние кнопки (без кнопки Забрать) */
  .bottom-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 400px;
  }
  .bottom-actions button {
    flex: 1;
    background: var(--panel-light);
    border: 1px solid var(--line);
    color: #fff;
    padding: 15px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
  }
  .bottom-actions button:hover:not(:disabled) { background: #2a344a; }
  .bottom-actions button:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Инфо-панели по бокам сетки */
  .info-floater {
    position: absolute;
    background: var(--panel-light);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    width: 120px;
    top: 50%;
    transform: translateY(-50%);
  }
  .info-floater.left { left: 40px; }
  .info-floater.right { right: 40px; }
  .info-floater img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 5px; }
  .info-floater p { font-size: 10px; color: var(--muted); line-height: 1.2; }
  .info-floater span { display: block; margin-top: 8px; padding: 4px; border-radius: 6px; font-weight: 800; font-size: 14px; }
  .info-floater.left span { background: var(--green); color: #000; }
  .info-floater.right span { background: var(--red); color: #fff; }

  @media (max-width: 1000px) {
    .mines-layout { grid-template-columns: 1fr; }
    .info-floater { display: none; }
    .cell { width: 60px; height: 60px; font-size: 24px; }
  }
  @media (max-width: 500px) {
    .cell { width: 50px; height: 50px; font-size: 20px; }
    .grid-container { gap: 8px; }
  }
</style>
</head>
<body>

<div class="app">
  
  <header class="header">
    <div class="header-left">
      <a href="/games" class="logo" style="text-decoration:none;">B</a>
      <div class="title" id="headerTitle">BLUP Games</div>
    </div>
    <div class="header-right">
      <div class="balance">Баланс: <span>$<span id="balDisplay">0</span></span></div>
      <a href="/" class="btn-back">На главную</a>
    </div>
  </header>

  <div id="lobbyView">
    <div class="nav-tabs">
      <button class="active" data-tab="games">Игры</button>
      <button data-tab="deposit">Пополнить</button>
      <button data-tab="promo">Промокод</button>
    </div>

    <div class="panel-content active" id="tab-games">
      <div class="game-list">
        <a href="#mines" class="game-card">
          <h2>Mines</h2>
          <p>Классический минёр</p>
        </a>
      </div>
    </div>

    <div class="panel-content" id="tab-deposit">
      <div class="form-box">
        <h2 style="text-align:center; margin-bottom:20px;">Пополнение баланса</h2>
        <input type="number" id="depositAmount" placeholder="Сумма в $" value="100" min="1">
        <button onclick="doDeposit()">Пополнить</button>
        <p id="depositStatus"></p>
      </div>
    </div>

    <div class="panel-content" id="tab-promo">
      <div class="form-box">
        <h2 style="text-align:center; margin-bottom:20px;">Активация промокода</h2>
        <input type="text" id="promoCode" placeholder="Введите промокод" maxlength="24">
        <button onclick="doPromo()">Применить</button>
        <p id="promoStatus"></p>
      </div>
    </div>
  </div>

  <div class="game-board" id="gameView">
    <div class="mines-layout">
      
      <div class="mines-sidebar">
        <div class="side-panel">
          <div class="side-label"><span>Количество мин</span> <span style="color:var(--red);" id="currentMinesLabel">💣 5</span></div>
          <div class="mine-selector" id="mineSelector">
            <button class="mine-btn" data-mines="3">3</button>
            <button class="mine-btn active" data-mines="5">5</button>
            <button class="mine-btn" data-mines="10">10</button>
            <button class="mine-btn" data-mines="24">24</button>
          </div>
        </div>

        <div class="side-panel">
          <div class="side-label">Ставка</div>
          <div class="bet-input-box">
            <span>💰</span>
            <input type="number" id="betAmount" value="1" min="1">
          </div>
          <div class="bet-quick">
            <button onclick="setBet(10)">1/2</button>
            <button onclick="setBet(50)">x2</button>
            <button onclick="setBet(1)">min</button>
            <button onclick="setBet(balance)">max</button>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn-main-action" id="mainActionBtn">Играть</button>
          <button class="btn-auto" id="autoBtn">Авто-выбор</button>
        </div>
      </div>

      <div class="mines-grid-panel">
        
        <div class="info-floater left" id="crownsCountBox" style="display: none;">
          <img src="https://cdn-icons-png.flaticon.com/512/190/190314.png" alt="crown">
          <p>Короны</p>
          <span id="crownsCount">0</span>
        </div>
        <div class="info-floater right" id="minesCountBox" style="display: none;">
          <img src="https://cdn-icons-png.flaticon.com/512/6131/6131448.png" alt="bomb">
          <p>Мины</p>
          <span id="minesCount">0</span>
        </div>

        <div class="grid-container" id="grid"></div>

        <!-- Нижние кнопки (без кнопки Забрать) -->
        <div class="bottom-actions">
          <button id="prevCoeffBtn" disabled>←</button>
          <button id="currCoeffBtn" disabled>1.000x</button>
          <button id="nextCoeffBtn" disabled>1.000x</button>
          <button id="nextRoundBtn" disabled>→</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  let balance = 0;
  let isGameActive = false;
  let currentBombs = 5;
  let gridCells = [];
  let bombsPositions = [];
  let openedCellsCount = 0;
  let currentMultiplier = 1.0;
  let autoPlayInterval = null;

  const balDisplay = document.getElementById('balDisplay');
  const grid = document.getElementById('grid');
  const mainActionBtn = document.getElementById('mainActionBtn');
  const autoBtn = document.getElementById('autoBtn');

  document.querySelectorAll('.nav-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  document.querySelectorAll('.mine-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isGameActive) return;
      document.querySelectorAll('.mine-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentBombs = Number(btn.dataset.mines);
      document.getElementById('currentMinesLabel').innerText = `💣 ${currentBombs}`;
    });
  });

  window.setBet = (amt) => {
    document.getElementById('betAmount').value = Math.max(1, Math.floor(amt));
  };

  function handleHash() {
    const hash = window.location.hash.replace('#', '');
    if (hash === 'mines') {
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').classList.add('active');
      document.getElementById('headerTitle').innerText = 'Mines';
      document.getElementById('gameView').style.display = 'block';
      initMines();
    } else {
      document.getElementById('lobbyView').style.display = 'block';
      document.getElementById('gameView').classList.remove('active');
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('headerTitle').innerText = 'BLUP Games';
    }
  }

  window.addEventListener('hashchange', handleHash);

  function initMines() {
    grid.innerHTML = '';
    gridCells = [];
    for (let i = 0; i < 25; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerText = '🔥';
      cell.dataset.index = i;
      cell.addEventListener('click', () => handleCellClick(i));
      grid.appendChild(cell);
      gridCells.push(cell);
    }
    resetGameState();
  }

  function resetGameState() {
    isGameActive = false;
    openedCellsCount = 0;
    currentMultiplier = 1.0;
    bombsPositions = [];
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
    
    gridCells.forEach((cell) => {
      cell.className = 'cell';
      cell.innerText = '🔥';
    });

    mainActionBtn.innerText = 'Играть';
    mainActionBtn.classList.remove('take');
    mainActionBtn.disabled = false;
    autoBtn.disabled = false;
    
    document.getElementById('currCoeffBtn').innerText = '1.000x';
    document.getElementById('nextCoeffBtn').innerText = '1.000x';

    document.getElementById('crownsCountBox').style.display = 'none';
    document.getElementById('minesCountBox').style.display = 'none';
    
    document.querySelectorAll('.mine-btn').forEach(b => b.disabled = false);
  }

  // Кнопка Играть / Забрать
  mainActionBtn.addEventListener('click', () => {
    if (isGameActive) {
      // Забрать
      if (openedCellsCount === 0) return; // Нельзя забрать, если ничего не открыто
      clearInterval(autoPlayInterval);
      const bet = Number(document.getElementById('betAmount').value);
      const win = Math.floor(bet * currentMultiplier);
      balance += win;
      balDisplay.innerText = balance.toFixed(2);
      alert(`Вы забрали выигрыш: $${win}`);
      revealAllCells();
      isGameActive = false;
      setTimeout(() => resetGameState(), 1500);
    } else {
      // Начать
      const bet = Number(document.getElementById('betAmount').value);
      if (bet < 1) return alert('Мин. ставка $1');
      if (bet > balance) return alert('Недостаточно средств на балансе!');

      balance -= bet;
      balDisplay.innerText = balance.toFixed(2);
      
      bombsPositions = [];
      while (bombsPositions.length < currentBombs) {
        const pos = Math.floor(Math.random() * 25);
        if (!bombsPositions.includes(pos)) bombsPositions.push(pos);
      }

      isGameActive = true;
      openedCellsCount = 0;
      currentMultiplier = 1.0;
      
      // Меняем кнопку на "Забрать" (но она будет неактивна до первого клика)
      mainActionBtn.innerText = 'Забрать';
      mainActionBtn.classList.add('take');
      mainActionBtn.disabled = true; 
      
      document.querySelectorAll('.mine-btn').forEach(b => b.disabled = true);
      autoBtn.disabled = false;
      
      document.getElementById('crownsCountBox').style.display = 'block';
      document.getElementById('minesCountBox').style.display = 'block';
      document.getElementById('crownsCount').innerText = '0';
      document.getElementById('minesCount').innerText = currentBombs;
      
      updateCoeffsUI();
    }
  });

  // Авто-выбор
  autoBtn.addEventListener('click', () => {
    if (!isGameActive) return alert('Сначала нажмите "Играть"');
    if (autoPlayInterval) {
      clearInterval(autoPlayInterval);
      autoPlayInterval = null;
      autoBtn.innerText = 'Авто-выбор';
      return;
    }

    autoBtn.innerText = 'Стоп';
    autoPlayInterval = setInterval(() => {
      if (!isGameActive) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        autoBtn.innerText = 'Авто-выбор';
        return;
      }
      
      const closedCells = gridCells.filter(c => !c.classList.contains('opened'));
      if (closedCells.length === 0) return;
      
      const randomCell = closedCells[Math.floor(Math.random() * closedCells.length)];
      const index = Number(randomCell.dataset.index);
      handleCellClick(index);
    }, 500);
  });

  function handleCellClick(index) {
    if (!isGameActive) return;
    const cell = gridCells[index];
    if (cell.classList.contains('opened')) return;

    cell.classList.add('opened');

    if (bombsPositions.includes(index)) {
      cell.classList.add('bomb');
      cell.innerText = '💣';
      endGame(false);
    } else {
      cell.classList.add('crown');
      cell.innerText = '👑';
      openedCellsCount++;
      document.getElementById('crownsCount').innerText = openedCellsCount;
      calculateMultiplier();
      updateCoeffsUI();
      
      // Активируем кнопку "Забрать" после первого клика
      if (openedCellsCount > 0 && mainActionBtn.classList.contains('take')) {
        mainActionBtn.disabled = false;
      }
    }
  }

  function calculateMultiplier() {
    const safeCells = 25 - currentBombs;
    const baseMult = 1 + (openedCellsCount * (currentBombs / 10));
    currentMultiplier = baseMult.toFixed(3);
  }

  function updateCoeffsUI() {
    document.getElementById('currCoeffBtn').innerText = `${currentMultiplier}x`;
    document.getElementById('nextCoeffBtn').innerText = `${(Number(currentMultiplier) + 0.25).toFixed(3)}x`;
  }

  function endGame(isWin) {
    isGameActive = false;
    clearInterval(autoPlayInterval);
    autoPlayInterval = null;
    autoBtn.innerText = 'Авто-выбор';
    revealAllCells();
    
    if (!isWin) {
      alert('💥 БУМ! Вы наткнулись на мину.');
      setTimeout(() => resetGameState(), 2000);
    }
  }

  function revealAllCells() {
    gridCells.forEach((cell, i) => {
      if (bombsPositions.includes(i) && !cell.classList.contains('opened')) {
        cell.innerText = '💣';
        cell.classList.add('opened');
      } else if (!bombsPositions.includes(i) && !cell.classList.contains('opened')) {
        cell.innerText = '👑';
        cell.classList.add('opened');
      }
    });
  }

  async function doDeposit() {
    const amt = Number(document.getElementById('depositAmount').value);
    const st = document.getElementById('depositStatus');
    st.innerText = 'Обработка...';
    try {
      const r = await fetch('/api/games/deposit', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ amount: amt }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      st.innerText = `Баланс пополнен на $${amt}`;
      st.style.color = '#4bff9f';
      loadBalance();
    } catch (e) { st.innerText = e.message; st.style.color = '#ff4b4b'; }
  }

  async function doPromo() {
    const code = document.getElementById('promoCode').value;
    const st = document.getElementById('promoStatus');
    st.innerText = 'Проверка...';
    try {
      const r = await fetch('/api/games/promo', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      st.innerText = `Бонус: +$${d.bonus}`;
      st.style.color = '#4bff9f';
      loadBalance();
    } catch (e) { st.innerText = e.message; st.style.color = '#ff4b4b'; }
  }

  async function loadBalance() {
    try {
      const r = await fetch('/api/games/balance');
      const d = await r.json();
      if (r.ok) {
        balance = d.balance;
        balDisplay.innerText = balance.toFixed(2);
      }
    } catch {}
  }

  loadBalance();
  handleHash();
</script>
</body>
</html>
