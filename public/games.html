<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/cases"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUP — Кейсы</title><link rel="stylesheet" href="/theme-redesign.css?v=20261116"></head><body><p>Раздел переехал: <a href="/cases">Открыть кейсы BLUP</a></p><script>(function(){if(document.querySelector('.blup-rate-tab'))return;const tab=document.createElement('button');tab.className='blup-rate-tab';tab.type='button';tab.textContent='КУРСЫ';const panel=document.createElement('aside');panel.className='blup-rate-panel';panel.innerHTML='<button class="blup-rate-close" type="button">×</button><h3>Курсы BLUP</h3><div class="blup-rate-row"><span>USDT / RUB</span><b data-rate="usdt">Загрузка…</b></div><div class="blup-rate-row"><span>GRAM / RUB</span><b data-rate="gram">Загрузка…</b></div><small>Курсы, установленные администратором</small>';document.body.append(tab,panel);const toggle=()=>panel.classList.toggle('open');tab.addEventListener('click',toggle);panel.querySelector('button').addEventListener('click',toggle);fetch('/api/rates').then(r=>r.json()).then(d=>{panel.querySelector('[data-rate="usdt"]').textContent=d.usdt?Number(d.usdt).toLocaleString('ru-RU')+' ₽':'Не задан';panel.querySelector('[data-rate="gram"]').textContent=d.gram?Number(d.gram).toLocaleString('ru-RU')+' ₽':'Не задан';}).catch(()=>{panel.querySelectorAll('[data-rate]').forEach(x=>x.textContent='Недоступен')});})();</script></body></html>
