<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUP Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  :root { --bg: #0b0f19; --panel: #151a26; --line: #232b3d; --text: #e2e8f0; --accent: #4b9fff; }
  body { background: var(--bg); color: var(--text); font-family: Manrope, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
  
  .games-wrap { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 20px; }
  
  /* Верхняя панель */
  .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--line); }
  .top-bar .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 900; }
  .top-bar .logo img { width: 32px; height: 32px; border-radius: 8px; }
  .balance-badge { background: #1e2638; padding: 8px 16px; border-radius: 8px; font-weight: 800; color: #fff; border: 1px solid var(--line); }
  
  /* Главный контейнер игры */
  .game-container { background: var(--panel); border-radius: 16px; border: 1px solid var(--line); padding: 30px; position: relative; overflow: hidden; }
  
  /* Колесо */
  .wheel-wrapper { position: relative; width: 100%; height: 350px; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 20px; }
  
  /* Само колесо (полукруг) */
  .wheel { 
    width: 600px; 
    height: 300px; 
    border-radius: 600px 600px 0 0; 
    position: relative; 
    background: #1a2233; 
    overflow: hidden;
    border: 12px solid #232b3d;
    border-bottom: none;
    transition: transform 5s cubic-bezier(0.1, 0.7, 0.1, 1);
  }
  
  /* Сегменты колеса (рисуем через conic-gradient) */
  .wheel-segments {
    position: absolute;
    inset: 0;
    /* Показываем полукруг */
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
    /* Этот фон будет заменяться через JS */
  }

  /* Слой для цветных полосок поверх колеса */
  .wheel-overlay {
    position: absolute;
    inset: 0;
    border-radius: 600px 600px 0 0;
    background: radial-gradient(circle at 50% 100%, transparent 40%, #1a2233 41%);
    pointer-events: none;
  }

  /* Стрелки */
  .arrow-top { position: absolute; top: 0px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #4b9fff; z-index: 10; text-shadow: 0 0 10px rgba(75, 159, 255, 0.5); }
  .arrow-bottom { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 24px; color: #4b9fff; z-index: 10; text-shadow: 0 0 10px rgba(75, 159, 255, 0.5); }

  /* Таймер по центру */
  .timer-box { 
    position: absolute; 
    top: 50%; left: 50%; transform: translate(-50%, -20%); 
    background: #1e2638; 
    border: 1px solid var(--line); 
    padding: 15px 30px; 
    border-radius: 12px; 
    text-align: center; 
    z-index: 10;
    min-width: 180px;
  }
  .timer-box .label { font-size: 10px; font-weight: 800; color: #4b9fff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
  .timer-box .time { font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .timer-box .time span { background: #0b0f19; padding: 2px 8px; border-radius: 6px; }
  .timer-box .status { font-size: 11px; color: #8fa5b5; margin-top: 5px; }

  /* Панель ставки и истории */
  .bottom-panels { display: grid; grid-template-columns: 250px 1fr; gap: 20px; margin-bottom: 20px; }
  .panel-item { background: #1a2233; border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .panel-item .title { font-size: 11px; color: #8fa5b5; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
  
  .bet-input-group { display: flex; gap: 10px; }
  .bet-input-group input { width: 100%; background: #0b0f19; border: 1px solid var(--line); border-radius: 8px; color: #fff; padding: 10px; font-weight: 800; font-size: 16px; outline: none; }
  .bet-quick-btns { display: flex; gap: 5px; margin-top: 10px; }
  .bet-quick-btns button { flex: 1; background: #232b3d; border: none; color: #8fa5b5; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer; }
  .bet-quick-btns button:hover { background: #2a344a; color: #fff; }

  /* История */
  .history-scroll { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; }
  .history-item { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: 900; color: #000; }

  /* Кнопки игры */
  .game-actions { display: grid; grid-template-columns: 1fr; gap: 15px; }
  .bet-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .bet-option-btn { 
    background: linear-gradient(180deg, #1a2233 0%, #131926 100%); 
    border: 1px solid var(--line); 
    border-radius: 12px; 
    padding: 15px; 
    text-align: center; 
    cursor: pointer; 
    transition: 0.2s; 
    position: relative; 
  }
  .bet-option-btn:hover { border-color: #4b9fff; }
  .bet-option-btn.selected { border-color: #4b9fff; background: #1e2a40; box-shadow: 0 0 15px rgba(75, 159, 255, 0.2); }
  .bet-option-btn .mult { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 5px; }
  .bet-option-btn .stats { display: flex; justify-content: space-between; font-size: 10px; color: #8fa5b5; }
  .bet-option-btn .stats span { display: flex; align-items: center; gap: 3px; }

  /* Цвета кнопок */
  .bet-option-btn[data-mult="2"] .mult { color: #4b9fff; }
  .bet-option-btn[data-mult="3"] .mult { color: #ffb84b; }
  .bet-option-btn[data-mult="5"] .mult { color: #ff4b4b; }
  .bet-option-btn[data-mult="10"] .mult { color: #4bff9f; }
  .bet-option-btn[data-mult="15"] .mult { color: #9f4bff; }
  .bet-option-btn[data-mult="20"] .mult { color: #ff7b4b; }
  .bet-option-btn[data-mult="50"] .mult { color: #4bff8d; }
  .bet-option-btn[data-mult="100"] .mult { color: #ff4b4b; }

  .main-action-btn { width: 100%; padding: 15px; border: none; border-radius: 12px; background: #4b9fff; color: #fff; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
  .main-action-btn:disabled { background: #232b3d; color: #8fa5b5; cursor: not-allowed; }
  .main-action-btn:hover:not(:disabled) { background: #3b8eee; }

  @media (max-width: 768px) {
    .wheel { width: 100%; height: 200px; border-radius: 400px 400px 0 0; }
    .bottom-panels { grid-template-columns: 1fr; }
    .bet-options { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="games-wrap">
  
  <div class="top-bar">
    <div class="logo">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234b9fff'/><text x='12' y='17' font-size='14' font-weight='bold' fill='white' text-anchor='middle'>B</text></svg>" alt="logo">
      Игра x<span id="gameMultiplierTitle">50</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <div class="balance-badge">Баланс: $<span id="gameBalance">0</span></div>
      <a href="/" class="btn btn-ghost btn-small" style="border-radius: 8px;">Назад</a>
    </div>
  </div>

  <div class="game-container">
    <!-- Колесо -->
    <div class="wheel-wrapper">
      <div class="arrow-top">▼</div>
      <div class="arrow-bottom">▼</div>
      
      <div class="wheel" id="gameWheel">
        <div class="wheel-segments" id="wheelSegments"></div>
      </div>

      <div class="timer-box" id="timerBox">
        <div class="label" id="timerLabel">НАЧАЛО ЧЕРЕЗ</div>
        <div class="time">
          <span id="timerSec1">0</span>
          <span id="timerSec2">0</span>
          :
          <span id="timerSec3">0</span>
          <span id="timerSec4">0</span>
        </div>
      </div>
    </div>

    <!-- Панели ставки и истории -->
    <div class="bottom-panels">
      <div class="panel-item">
        <div class="title">Ставка</div>
        <div class="bet-input-group">
          <input type="number" id="betAmountInput" value="10" min="1">
        </div>
        <div class="bet-quick-btns">
          <button onclick="setBet(10)">1/2</button>
          <button onclick="setBet(50)">x2</button>
          <button onclick="setBet(100)">min</button>
          <button onclick="setBet(500)">max</button>
        </div>
      </div>

      <div class="panel-item">
        <div class="title">История</div>
        <div class="history-scroll" id="historyContainer">
          <!-- Заполняется JS -->
        </div>
      </div>
    </div>

    <!-- Кнопки выбора коэффициента -->
    <div class="game-actions">
      <div class="bet-options" id="betOptionsContainer">
        <!-- Заполняется JS -->
      </div>

      <button class="main-action-btn" id="mainActionBtn">Сделать ставку</button>
    </div>

  </div>
</div>

<script>
  // --- НАСТРОЙКИ ИГРЫ ---
  let currentGameMode = 'x50'; // 'x50' или 'x100'
  let balance = 0;
  let selectedMultiplier = 2;
  let isSpinning = false;
  let timerInterval = null;

  const config = {
    x50: {
      title: "50",
      multipliers: [
        { val: 2, color: '#4b9fff' },
        { val: 3, color: '#ffb84b' },
        { val: 5, color: '#ff4b4b' },
        { val: 50, color: '#4bff8d' }
      ]
    },
    x100: {
      title: "100",
      multipliers: [
        { val: 2, color: '#4b9fff' },
        { val: 3, color: '#ffb84b' },
        { val: 5, color: '#ff4b4b' },
        { val: 10, color: '#4bff9f' },
        { val: 15, color: '#9f4bff' },
        { val: 20, color: '#ff7b4b' },
        { val: 100, color: '#ff4b4b' }
      ]
    }
  };

  const wheelEl = document.getElementById('gameWheel');
  const segmentsEl = document.getElementById('wheelSegments');
  const betOptionsEl = document.getElementById('betOptionsContainer');
  const mainBtn = document.getElementById('mainActionBtn');
  const timerBox = document.getElementById('timerBox');
  
  // --- ГЕНЕРАЦИЯ ЦВЕТНЫХ ПОЛОСОК НА КОЛЕСЕ ---
  function renderWheelVisual() {
    const colors = config[currentGameMode].multipliers;
    const numSegments = 20; // Примерно 20 полосок на полукруге
    let gradientParts = [];
    
    for (let i = 0; i < numSegments; i++) {
      // Берем случайный цвет из доступных для этой игры
      const c = colors[Math.floor(Math.random() * colors.length)];
      const startAngle = (i / numSegments) * 180;
      const endAngle = ((i + 1) / numSegments) * 180;
      gradientParts.push(`${c.color} ${startAngle}deg ${endAngle}deg`);
    }
    
    // Создаем круговой градиент (колесо)
    segmentsEl.style.background = `conic-gradient(from -90deg at 50% 100%, ${gradientParts.join(', ')})`;
  }

  // --- ОТРИСОВКА КНОПОК СТАВОК ---
  function renderBetButtons() {
    const mults = config[currentGameMode].multipliers;
    betOptionsEl.innerHTML = mults.map(m => `
      <div class="bet-option-btn ${m.val === selectedMultiplier ? 'selected' : ''}" data-mult="${m.val}">
        <div class="mult">X${m.val}</div>
        <div class="stats">
          <span><i>👤</i> ${Math.floor(Math.random()*10)}</span>
          <span>0 <i>🪙</i></span>
        </div>
      </div>
    `).join('');

    // Вешаем клики
    document.querySelectorAll('.bet-option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (isSpinning) return;
        selectedMultiplier = Number(btn.dataset.mult);
        document.querySelectorAll('.bet-option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  }

  // --- СМЕНА ИГРЫ (x50 / x100) ---
  function switchGame(mode) {
    if (isSpinning) return;
    currentGameMode = mode;
    document.getElementById('gameMultiplierTitle').innerText = config[mode].title;
    selectedMultiplier = config[mode].multipliers[0].val;
    
    renderWheelVisual();
    renderBetButtons();
    
    // Сброс колеса
    wheelEl.style.transition = 'none';
    wheelEl.style.transform = 'rotate(0deg)';
  }

  // --- ЛОГИКА СТАВКИ И ВРАЩЕНИЯ ---
  mainBtn.addEventListener('click', async () => {
    const betAmount = Number(document.getElementById('betAmountInput').value);
    
    if (isSpinning) return;
    if (betAmount < 1) return alert('Минимальная ставка $1');
    if (betAmount > balance) return alert('Недостаточно средств');

    isSpinning = true;
    mainBtn.disabled = true;
    mainBtn.innerText = 'ОЖИДАНИЕ...';
    timerBox.style.opacity = '0'; // Прячем таймер на время игры

    try {
      // Делаем запрос на сервер
      const r = await fetch('/api/games/bet', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ game: currentGameMode, amount: betAmount, multiplier: selectedMultiplier })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error);

      // Сервер вернул результат. Запускаем анимацию.
      animateWheel(data);
      
    } catch (e) {
      alert(e.message);
      isSpinning = false;
      mainBtn.disabled = false;
      mainBtn.innerText = 'СДЕЛАТЬ СТАВКУ';
      timerBox.style.opacity = '1';
      startTimer();
    }
  });

  function animateWheel(result) {
    // Рассчитываем случайный угол для остановки
    const randomAngle = Math.floor(Math.random() * 360) + 1440; // 4 полных оборота
    
    // Запускаем вращение (10 секунд, как ты просил)
    wheelEl.style.transition = 'transform 10s cubic-bezier(0.1, 0.7, 0.1, 1)';
    wheelEl.style.transform = `rotate(${randomAngle}deg)`;

    // Ждем окончания анимации (10 секунд)
    setTimeout(() => {
      // Обновляем баланс
      balance = result.newBalance;
      document.getElementById('gameBalance').innerText = balance.toFixed(2);

      // Добавляем в историю
      addToHistory(selectedMultiplier);

      // Показываем результат
      if (result.win) {
        alert(`🎉 ВЫИГРЫШ! Выпал X${selectedMultiplier}. Вы получили $${result.winAmount}`);
      } else {
        alert(`😔 Выпал X${selectedMultiplier}. Вы проиграли.`);
      }

      // Разблокируем интерфейс
      isSpinning = false;
      mainBtn.disabled = false;
      mainBtn.innerText = 'СДЕЛАТЬ СТАВКУ';
      
      // Показываем таймер снова и запускаем
      timerBox.style.opacity = '1';
      startTimer();

      // Через секунду сбрасываем колесо визуально (чтобы не накапливать градусы)
      setTimeout(() => {
        wheelEl.style.transition = 'none';
        wheelEl.style.transform = 'rotate(0deg)';
      }, 1000);

    }, 10000); // 10 секунд анимации
  }

  // --- ИСТОРИЯ ---
  const historyEl = document.getElementById('historyContainer');
  function addToHistory(mult) {
    const div = document.createElement('div');
    div.className = 'history-item';
    const color = config[currentGameMode].multipliers.find(m => m.val === mult)?.color || '#fff';
    div.style.background = color;
    div.innerText = mult;
    historyEl.prepend(div);
    if (historyEl.children.length > 20) {
      historyEl.lastChild.remove();
    }
  }

  // --- ТАЙМЕР ---
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    
    let seconds = 15;
    document.getElementById('timerLabel').innerText = 'НАЧАЛО ЧЕРЕЗ';
    
    const updateDisplay = () => {
      const s1 = Math.floor(seconds / 10);
      const s2 = seconds % 10;
      document.getElementById('timerSec1').innerText = s1;
      document.getElementById('timerSec2').innerText = s2;
      document.getElementById('timerSec3').innerText = 0;
      document.getElementById('timerSec4').innerText = 0;
    };

    updateDisplay();

    timerInterval = setInterval(() => {
      seconds--;
      if (seconds <= 0) {
        clearInterval(timerInterval);
        seconds = 15;
      }
      updateDisplay();
    }, 1000);
  }

  // --- ВСПОМОГАТЕЛЬНЫЕ ---
  window.setBet = (amount) => {
    document.getElementById('betAmountInput').value = amount;
  };

  // --- ЗАГРУЗКА БАЛАНСА ---
  async function loadBalance() {
    try {
      const r = await fetch('/api/games/balance');
      const d = await r.json();
      if (r.ok) {
        balance = d.balance;
        document.getElementById('gameBalance').innerText = balance.toFixed(2);
      }
    } catch {}
  }

  // --- ИНИЦИАЛИЗАЦИЯ ---
  loadBalance();
  switchGame('x50');
  startTimer();

  // Для переключения между x50 и x100 можно добавить кнопки (сейчас для простоты x50 по умолчанию)
  // Если хочешь переключатель, добавь в HTML кнопки и вызови switchGame('x100')
  
</script>
</body>
</html>
