<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BLUP Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f121a;
    --panel: #181c27;
    --panel-light: #1e2433;
    --text: #ffffff;
    --muted: #7785b3;
    --accent: #3d8aff;
    --line: #2a3347;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 15px;
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 15px; }

  /* --- ХЕДЕР --- */
  .header { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 12px 20px; border-radius: 12px; }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: 900; color:#fff; text-decoration:none; }
  .title { font-size: 18px; font-weight: 800; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .balance { background: var(--panel-light); padding: 8px 16px; border-radius: 10px; font-weight: 700; border: 1px solid var(--line); }
  .balance span { color: var(--accent); }
  .btn-back { background: var(--panel-light); border: 1px solid var(--line); color: var(--text); padding: 8px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; transition: 0.2s; }
  .btn-back:hover { background: var(--line); }

  /* --- ЛОББИ --- */
  .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .nav-tabs button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 800; transition: 0.2s; }
  .nav-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .panel-content { display: none; background: var(--panel); border-radius: 16px; border: 1px solid var(--line); padding: 30px; }
  .panel-content.active { display: block; }

  .game-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .game-card { background: var(--panel-light); border: 1px solid var(--line); border-radius: 16px; padding: 20px; text-align: center; text-decoration: none; color: #fff; transition: 0.2s; }
  .game-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .game-card h2 { font-size: 24px; margin-bottom: 10px; color: var(--accent); }
  .game-card p { font-size: 12px; color: var(--muted); }

  .form-box { max-width: 400px; margin: 0 auto; }
  .form-box input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: #fff; padding: 15px; border-radius: 10px; font-size: 16px; margin-bottom: 15px; outline: none; }
  .form-box button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
  .form-box p { margin-top: 15px; text-align: center; font-weight: 600; }

  /* --- ИГРА (КАК НА Hotskins) --- */
  .game-board { background: var(--panel); border-radius: 16px; padding: 30px; position: relative; display: none; flex-direction: column; align-items: center; border: 1px solid var(--line); }
  .game-board.active { display: flex; }

  /* Стрелки */
  .wheel-arrows {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
  }
  .arrow-top {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 20px solid var(--accent);
    filter: drop-shadow(0 0 8px var(--accent));
  }
  .arrow-bottom {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 20px solid var(--accent);
    filter: drop-shadow(0 0 8px var(--accent));
    opacity: 0.3;
  }

  /* Колесо */
  .wheel-container { position: relative; width: 100%; max-width: 700px; height: 380px; margin: 0 auto; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
  
  .wheel-spinner {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: contain;
    z-index: 1;
    transition: transform 6s cubic-bezier(0.1, 0.7, 0.1, 1);
    transform-origin: center bottom;
  }

  .wheel-inner-mask {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 230px;
    background: var(--panel);
    border-radius: 460px 460px 0 0;
    z-index: 3;
  }

  /* Таймер (в красном квадрате) */
  .timer-panel {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: #252c3f;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 24px;
    text-align: center;
    z-index: 4;
    min-width: 160px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .timer-label { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .timer-digits { font-size: 24px; font-weight: 900; display: flex; justify-content: center; gap: 4px; }
  .timer-digits span { background: var(--bg); padding: 2px 8px; border-radius: 6px; color: #fff; }

  /* Панели */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-bottom: 15px; z-index: 5; margin-top: 20px;}
  .info-box { background: var(--panel-light); border: 1px solid var(--line); border-radius: 12px; padding: 15px; }
  .info-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .bet-input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: #fff; font-size: 16px; font-weight: 800; padding: 10px 15px; border-radius: 8px; outline: none; }
  .history { display: flex; gap: 6px; overflow: hidden; height: 40px; align-items: center; }
  .hist-item { width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: 900; color: #000; flex-shrink: 0; }

  /* Кнопки */
  .bet-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; z-index: 5; }
  .bet-card { background: var(--panel-light); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 8px; user-select: none; }
  .bet-card:hover { border-color: var(--accent); }
  .bet-card.selected { border-color: var(--accent); background: #1e2640; box-shadow: 0 0 15px rgba(61,138,255,0.2); }
  .bet-header { display: flex; justify-content: space-between; align-items: center; }
  .bet-mult { font-size: 16px; font-weight: 900; }
  .bet-footer { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  
  .bet-card[data-mult="2"] .bet-mult { color: #3d8aff; }
  .bet-card[data-mult="3"] .bet-mult { color: #ffb84b; }
  .bet-card[data-mult="5"] .bet-mult { color: #ff4b4b; }
  .bet-card[data-mult="10"] .bet-mult { color: #4bff9f; }
  .bet-card[data-mult="15"] .bet-mult { color: #9f4bff; }
  .bet-card[data-mult="20"] .bet-mult { color: #ff7b4b; }
  .bet-card[data-mult="50"] .bet-mult { color: #4bff8d; }
  .bet-card[data-mult="100"] .bet-mult { color: #ff4b4b; }

  @media (max-width: 768px) {
    .bet-grid { grid-template-columns: repeat(2, 1fr); }
    .info-grid { grid-template-columns: 1fr; }
    .wheel-container { height: 250px; }
    .timer-panel { bottom: 20px; padding: 8px 16px; min-width: 130px;}
    .timer-digits { font-size: 18px; }
    .wheel-inner-mask { width: 320px; height: 160px; }
  }
</style>
</head>
<body>

<div class="app">
  
  <header class="header">
    <div class="header-left">
      <a href="/games" class="logo" style="text-decoration:none;">B</a>
      <div class="title" id="headerTitle">BLUP Games</div>
    </div>
    <div class="header-right">
      <div class="balance">Баланс: <span>$<span id="balDisplay">0</span></span></div>
      <a href="/" class="btn-back">На главную</a>
    </div>
  </header>

  <!-- ЛОББИ -->
  <div id="lobbyView">
    <div class="nav-tabs">
      <button class="active" data-tab="games">Игры</button>
      <button data-tab="deposit">Пополнить</button>
      <button data-tab="promo">Промокод</button>
    </div>

    <div class="panel-content active" id="tab-games">
      <div class="game-list">
        <a href="#x50" class="game-card">
          <h2>Игра x50</h2>
          <p>Множители: x2, x3, x5, x50</p>
        </a>
        <a href="#x100" class="game-card">
          <h2>Игра x100</h2>
          <p>Множители: x2, x3, x5, x10, x15, x20, x100</p>
        </a>
      </div>
    </div>

    <div class="panel-content" id="tab-deposit">
      <div class="form-box">
        <h2 style="text-align:center; margin-bottom:20px;">Пополнение баланса</h2>
        <input type="number" id="depositAmount" placeholder="Сумма в $" value="100" min="1">
        <button onclick="doDeposit()">Пополнить</button>
        <p id="depositStatus"></p>
      </div>
    </div>

    <div class="panel-content" id="tab-promo">
      <div class="form-box">
        <h2 style="text-align:center; margin-bottom:20px;">Активация промокода</h2>
        <input type="text" id="promoCode" placeholder="Введите промокод" maxlength="24">
        <button onclick="doPromo()">Применить</button>
        <p id="promoStatus"></p>
      </div>
    </div>
  </div>

  <!-- ИГРА -->
  <div class="game-board" id="gameView">
    
    <div class="wheel-arrows">
      <div class="arrow-top"></div>
      <div class="arrow-bottom"></div>
    </div>

    <div class="wheel-container">
      <div class="wheel-spinner" id="wheelImage"></div>
      <div class="wheel-inner-mask"></div>
      <div class="timer-panel" id="timerPanel">
        <div class="timer-label">НАЧАЛО ЧЕРЕЗ</div>
        <div class="timer-digits">
          <span id="t1">0</span><span id="t2">0</span>:<span id="t3">0</span><span id="t4">0</span>
        </div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">СТАВКА</div>
        <input type="number" id="betInput" class="bet-input" value="1" min="1">
      </div>
      <div class="info-box">
        <div class="info-label">ИСТОРИЯ</div>
        <div class="history" id="historyList"></div>
      </div>
    </div>

    <div class="bet-grid" id="betGrid"></div>
  </div>
</div>

<script>
  const gameConfig = {
    x50: {
      title: "Игра x50",
      image: "https://hotskins30.ai/storage/images/x50/whell-dark.webp",
      multipliers: [
        { val: 2, color: '#3d8aff' }, { val: 3, color: '#ffb84b' }, 
        { val: 5, color: '#ff4b4b' }, { val: 50, color: '#4bff8d' }
      ]
    },
    x100: {
      title: "Игра x100",
      image: "https://hotskins30.ai/storage/images/x100/whell-dark.webp",
      multipliers: [
        { val: 2, color: '#3d8aff' }, { val: 3, color: '#ffb84b' }, 
        { val: 5, color: '#ff4b4b' }, { val: 10, color: '#4bff9f' },
        { val: 15, color: '#9f4bff' }, { val: 20, color: '#ff7b4b' },
        { val: 100, color: '#ff4b4b' }
      ]
    }
  };

  let currentGame = 'x50';
  let balance = 0;
  let isSpinning = false;
  let isBettingOpen = false;
  let timerInt = null;
  let timeLeft = 20;
  let currentBets = [];

  const bgElement = document.getElementById('wheelImage');
  const betGrid = document.getElementById('betGrid');
  const timerPanel = document.getElementById('timerPanel');

  document.querySelectorAll('.nav-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel-content').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  async function doDeposit() {
    const amt = Number(document.getElementById('depositAmount').value);
    const st = document.getElementById('depositStatus');
    st.innerText = 'Обработка...';
    try {
      const r = await fetch('/api/games/deposit', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ amount: amt }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      st.innerText = `Баланс пополнен на $${amt}`;
      st.style.color = '#4bff9f';
      loadBalance();
    } catch (e) { st.innerText = e.message; st.style.color = '#ff4b4b'; }
  }

  async function doPromo() {
    const code = document.getElementById('promoCode').value;
    const st = document.getElementById('promoStatus');
    st.innerText = 'Проверка...';
    try {
      const r = await fetch('/api/games/promo', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      st.innerText = `Бонус: +$${d.bonus}`;
      st.style.color = '#4bff9f';
      loadBalance();
    } catch (e) { st.innerText = e.message; st.style.color = '#ff4b4b'; }
  }

  function handleHash() {
    const hash = window.location.hash.replace('#', '');
    if (hash === 'x50' || hash === 'x100') {
      currentGame = hash;
      document.getElementById('lobbyView').style.display = 'none';
      document.getElementById('gameView').classList.add('active');
      document.getElementById('headerTitle').innerText = gameConfig[currentGame].title;
      document.getElementById('gameView').style.display = 'flex';
      bgElement.style.backgroundImage = `url('${gameConfig[currentGame].image}')`;
      initGame();
    } else {
      document.getElementById('lobbyView').style.display = 'block';
      document.getElementById('gameView').classList.remove('active');
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('headerTitle').innerText = 'BLUP Games';
      if (timerInt) clearInterval(timerInt);
    }
  }

  window.addEventListener('hashchange', handleHash);

  function initGame() {
    renderButtons();
    currentBets = [];
    startRoundTimer();
  }

  function renderButtons() {
    const mults = gameConfig[currentGame].multipliers;
    betGrid.innerHTML = mults.map(m => `
      <div class="bet-card" data-mult="${m.val}">
        <div class="bet-header">
          <span class="bet-mult">x${m.val}</span>
          <span style="color:${m.color}">⬇</span>
        </div>
        <div class="bet-footer">
          <span>👤 ${Math.floor(Math.random()*10)}</span>
          <span>0 💰</span>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.bet-card').forEach(card => {
      card.addEventListener('click', async () => {
        if (!isBettingOpen) return alert('Ставки на этот раунд закрыты. Ждите следующего.');
        
        const mult = Number(card.dataset.mult);
        const bet = Number(document.getElementById('betInput').value);
        
        if (bet < 1) return alert('Мин. ставка $1');
        if (bet > balance) return alert('Недостаточно средств на балансе!');

        balance -= bet;
        document.getElementById('balDisplay').innerText = balance.toFixed(2);
        currentBets.push({ mult, bet });
        
        card.style.borderColor = '#4bff9f';
        card.style.background = '#1e2640';
      });
    });
  }

  function startRoundTimer() {
    if (timerInt) clearInterval(timerInt);
    timeLeft = 20;
    isBettingOpen = true;
    isSpinning = false;
    timerPanel.style.opacity = '1';
    updateTimerDisplay();

    timerInt = setInterval(() => {
      timeLeft--;
      updateTimerDisplay();
      if (timeLeft <= 0) {
        clearInterval(timerInt);
        if (isBettingOpen) spinWheel();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    document.getElementById('t1').innerText = Math.floor(timeLeft / 10);
    document.getElementById('t2').innerText = timeLeft % 10;
    document.getElementById('t3').innerText = 0;
    document.getElementById('t4').innerText = 0;
  }

  async function spinWheel() {
    if (!isBettingOpen) return;
    isBettingOpen = false;
    isSpinning = true;
    timerPanel.style.opacity = '0';

    document.querySelectorAll('.bet-card').forEach(c => {
      c.style.borderColor = '';
      c.style.background = '';
    });

    if (currentBets.length === 0) {
      animateSpin(null);
      return;
    }

    try {
      const primaryBet = currentBets[0];
      const r = await fetch('/api/games/bet', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ game: currentGame, amount: primaryBet.bet, multiplier: primaryBet.mult })
      });
      const data = await r.json();
      animateSpin(data);
    } catch (e) {
      console.error(e);
      animateSpin(null);
    }
  }

  function animateSpin(result) {
    const randomDeg = Math.floor(Math.random() * 360) + 1440;
    bgElement.style.transition = 'transform 5s cubic-bezier(0.1, 0.7, 0.1, 1)';
    bgElement.style.transform = `rotate(${randomDeg}deg)`;

    setTimeout(() => {
      if (result) {
        balance = result.newBalance;
        document.getElementById('balDisplay').innerText = balance.toFixed(2);
        
        const winMult = currentBets[0].mult; 
        addHistory(winMult);

        if (result.win) {
          alert(`🎉 ВЫИГРЫШ! Выпал x${winMult}. Вы получили $${result.winAmount}`);
        } else {
          alert(`😔 Вы проиграли.`);
        }
      }

      setTimeout(() => {
        bgElement.style.transition = 'none';
        bgElement.style.transform = 'rotate(0deg)';
        currentBets = [];
        startRoundTimer();
      }, 500);
    }, 5000);
  }

  function addHistory(mult) {
    const list = document.getElementById('historyList');
    const div = document.createElement('div');
    div.className = 'hist-item';
    const color = gameConfig[currentGame].multipliers.find(m => m.val === mult)?.color || '#fff';
    div.style.background = color;
    div.innerText = mult;
    list.prepend(div);
    if (list.children.length > 8) list.lastChild.remove();
  }

  async function loadBalance() {
    try {
      const r = await fetch('/api/games/balance');
      const d = await r.json();
      if (r.ok) {
        balance = d.balance;
        document.getElementById('balDisplay').innerText = balance.toFixed(2);
      }
    } catch {}
  }

  loadBalance();
  handleHash();
</script>
</body>
</html>
