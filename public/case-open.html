<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111d"><title>BLUP — Кейс</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/cases.css"><link rel="stylesheet" href="/case-open.css"></head>
<body class="case-opening-page"><main class="open-page">
<header class="case-top"><a class="back-pill" href="/cases">← <span>Назад</span></a><h1 id="caseName">Загрузка…</h1><div class="open-wallet"><label>Валюта <select id="openCurrency"><option value="USDT">USDT</option><option value="RUB">RUB</option></select></label><b id="balanceValue">Баланс: —</b></div><button id="promoToggle" class="bonus-pill" type="button">Бонус-код <span class="bonus-icon">▦</span></button></header>
<div id="promoPanel" class="promo-panel hidden"><label for="casePromo">Промокод на этот кейс</label><div class="promo-row"><input id="casePromo" placeholder="Введи промокод" maxlength="32"><button id="applyPromo" class="promo-apply">Применить</button></div><p id="promoMessage" aria-live="polite"></p></div>
<section class="case-stage"><div id="showcaseStrip" class="showcase-strip"><div class="showcase-track" id="showcaseTrack"></div><div class="showcase-vignette"></div><div class="hero-case-art"><img id="caseCover" alt="Обложка кейса"></div></div>
<div class="case-controls"><div class="count-picker" id="countChoices"><button class="count-choice active" data-count="1">x1</button><button class="count-choice" data-count="2">x2</button><button class="count-choice" data-count="3">x3</button><button class="count-choice" data-count="4">x4</button><button class="count-choice" data-count="5">x5</button></div><button id="openCase" class="open-button">Открыть за —</button><div class="speed-picker"><button class="speed-choice active" data-speed="normal">Стандарт</button><span class="speed-divider">◉</span><button class="speed-choice" data-speed="fast">Быстро</button></div></div>
<div class="promo-summary"><span id="openMessage"></span><span id="balanceValue"></span></div>
</section>
<section class="opening-area" id="openingArea"><div id="resultGrid" class="result-grid hidden"></div></section>
<section class="possible-section"><h2><span class="stack-icon">▰</span> Содержимое кейса</h2><div id="possibleSkins" class="possible-grid"></div></section>
</main><div id="toast" class="toast"></div><script src="/case-open.js"></script></body></html>
