<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUP — Управление кейсами</title><link rel="stylesheet" href="/admin.css"><style>body{padding:28px}.case-admin{max-width:1250px;margin:auto}.case-admin h1{color:#fff}.case-admin h2{color:#fff;margin-top:30px}.case-table{width:100%;border-collapse:collapse;background:#11182a;border-radius:12px;overflow:hidden;color:#eaf0ff;font-size:12px}.case-table th,.case-table td{padding:11px;border-bottom:1px solid #28314a;text-align:left;vertical-align:top}.case-table th{color:#8fa2c5}.case-table button{border:0;border-radius:7px;padding:7px 10px;margin:2px;cursor:pointer;font-weight:800}.approve{background:#3ed59b;color:#07140f}.reject{background:#e45c79;color:white}.muted{color:#8fa2c5}.back{display:inline-block;margin-bottom:12px;color:#9fafff}.admin-error{color:#ff859d}</style></head><body><main class="case-admin"><a class="back" href="/admin">← Вернуться в админ-панель</a><h1>Кейсы BLUP — заявки</h1><p class="muted">Проверяй хэш транзакции перед подтверждением пополнения. Подтверждение зачисляет сумму и промо-бонус на баланс пользователя.</p><h2>Пополнения</h2><div id="deposits">Загрузка…</div><h2>Выводы</h2><div id="withdrawals">Загрузка…</div><p id="error" class="admin-error"></p></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){let r=await fetch(u,{...o,headers:{...(o.body?{'Content-Type':'application/json'}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}function table(rows,type){if(!rows.length)return '<p class="muted">Заявок пока нет.</p>';let deposit=type==='deposit';return `<table class="case-table"><thead><tr><th>ID / Пользователь</th><th>${deposit?'Перевод':'Сумма'}</th><th>${deposit?'Сеть / TX':'Реквизиты'}</th><th>Статус</th><th>Дата</th><th>Действия</th></tr></thead><tbody>${rows.map(x=>`<tr><td>#${x.id}<br>${esc(x.nickname)} <span class="muted">#${esc(x.public_id||'—')}</span></td><td>${deposit?`${Number(x.token_amount||0).toFixed(x.coin==='TON'?4:2)} ${esc(x.coin)} (~$${Number(x.amount).toFixed(2)})<br>Бонус: $${Number(x.bonus_amount).toFixed(2)}<br><b>Зачислить: $${Number(x.credited_amount).toFixed(2)}</b>`:`$${Number(x.amount).toFixed(2)}`}</td><td>${deposit?`${esc(x.coin)} / ${esc(x.network)}<br><small>${esc(x.tx_hash||'TX не указан')}</small><br><small>${esc(x.wallet)}</small>`:`${esc(x.payout_type)}<br>${esc(x.phone)}<br>${esc(x.bank)}`}</td><td>${esc(x.status)}</td><td>${esc(x.created_at)}</td><td>${x.status==='pending'?`<button class="approve" onclick="act('${type}',${x.id},'approved')">Подтвердить</button><button class="reject" onclick="act('${type}',${x.id},'rejected')">Отклонить</button>`:'—'}</td></tr>`).join('')}</tbody></table>`}async function load(){try{let [d,w]=await Promise.all([api('/api/admin/cases/deposits'),api('/api/admin/cases/withdrawals')]);$('#deposits').innerHTML=table(d,'deposit');$('#withdrawals').innerHTML=table(w,'withdraw')}catch(e){$('#error').textContent=e.message;if(e.message.includes('Доступ'))location.href='/admin'}}window.act=async(type,id,status)=>{if(!confirm(status==='approved'?'Подтвердить заявку?':'Отклонить заявку?'))return;try{await api(`/api/admin/cases/${type==='deposit'?'deposits':'withdrawals'}/${id}/status`,{method:'POST',body:JSON.stringify({status})});load()}catch(e){$('#error').textContent=e.message}};load();
</script></body></html>
