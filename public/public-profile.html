<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12"><title>Профиль пользователя — BLUP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/profile.css"><style>.public-profile-shell{max-width:850px;margin:70px auto;padding:0 20px}.public-profile-card{background:rgba(12,18,35,.88);border:1px solid rgba(130,170,210,.16);border-radius:22px;padding:30px;box-shadow:0 24px 80px #0005}.public-profile-top{display:flex;align-items:center;gap:20px;margin-bottom:28px}.public-profile-avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#17233c;border:2px solid #3b829a}.public-profile-avatar-fallback{display:grid;place-items:center;font-size:32px;font-weight:900;color:#9ee5df}.public-profile-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.public-profile-item{background:#0b1224;border:1px solid #ffffff12;border-radius:12px;padding:16px}.public-profile-item small{display:block;color:#91a5bb;margin-bottom:8px}.public-profile-item b{font-size:16px;overflow-wrap:anywhere}.public-profile-error{color:#ff8f9a;text-align:center;padding:24px}@media(max-width:560px){.public-profile-card{padding:20px}.public-profile-top{align-items:flex-start}.public-profile-avatar{width:70px;height:70px}}</style></head>
<body class="profile-body"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><header class="header"><a class="brand" href="/"><span class="brand-orb"></span><span>BLUP</span></a><nav class="nav"><a class="nav-link" href="/">Главная</a></nav><div class="header-actions"><a class="btn btn-ghost btn-small" href="/">На сайт ↗</a></div></header>
<main class="public-profile-shell"><div id="publicProfileError" class="public-profile-error">Загружаем профиль…</div><section id="publicProfileCard" class="public-profile-card" hidden><div class="public-profile-top"><img id="publicAvatar" class="public-profile-avatar" alt="Аватар пользователя"><div><span class="profile-eyebrow">BLUP / PUBLIC PROFILE</span><h1 id="publicNickname" style="margin:6px 0">—</h1><span id="publicId" class="pill">#—</span></div></div><div class="public-profile-grid"><div class="public-profile-item"><small>Telegram username</small><b id="publicTgUsername">—</b></div><div class="public-profile-item"><small>Telegram ID</small><b id="publicTgId">—</b></div><div class="public-profile-item"><small>Продано на сайте</small><b id="publicSold">—</b></div><div class="public-profile-item"><small>Дата регистрации</small><b id="publicCreated">—</b></div></div></section></main><script src="/public-profile.js"></script></body></html>
