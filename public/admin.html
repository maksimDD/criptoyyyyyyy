<section class="admin-card table-card">
  <div class="admin-card-head">
    <div><span class="eyebrow">PROMO CODES</span><h2>Промокоды</h2></div>
  </div>

  <form id="promoAdminForm" class="settings-form">
    <label>Код промокода
      <input name="code" required maxlength="24" placeholder="BLUP2026">
    </label>

    <label>Награда
      <div class="blup-select" data-name="rewardType" data-value="sell_discount_1">
        <button type="button" class="blup-select-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="blup-select-icon">%</span>
          <span class="blup-select-label">Скидка 1% на продажу</span>
          <span class="blup-select-chevron"></span>
        </button>
        <ul class="blup-select-menu" role="listbox" tabindex="-1">
          <li role="option" data-value="sell_discount_1" data-icon="%" class="is-selected">
            <span class="opt-icon">%</span>
            <span class="opt-text"><b>Скидка 1% на продажу</b><small>Снижение комиссии при продаже</small></span>
          </li>
          <li role="option" data-value="sell_discount_3" data-icon="%">
            <span class="opt-icon">%</span>
            <span class="opt-text"><b>Скидка 3% на продажу</b><small>Повышенная скидка на комиссию</small></span>
          </li>
          <li role="option" data-value="deposit_150" data-icon="₽">
            <span class="opt-icon">₽</span>
            <span class="opt-text"><b>Депозит 150 ₽ на КБ</b><small>Зачисление на карту банка</small></span>
          </li>
          <li role="option" data-value="deposit_300" data-icon="₽">
            <span class="opt-icon">₽</span>
            <span class="opt-text"><b>Депозит 300 ₽ на Жабу</b><small>Зачисление на жабу-кошелёк</small></span>
          </li>
        </ul>
        <input type="hidden" name="rewardType" value="sell_discount_1">
      </div>
    </label>

    <label>Лимит активаций (0 — без лимита)
      <input name="activationLimit" type="number" min="0" step="1" value="0">
    </label>

    <label>Описание (необязательно)
      <input name="description" maxlength="200" placeholder="Условия промокода">
    </label>

    <button class="btn btn-primary">Создать промокод</button>
  </form>

  <div id="promoAdminList" class="ban-list"></div>

  <div class="admin-card-head" style="margin-top:18px">
    <h3>Выдать скидку пользователю по ID</h3>
  </div>

  <form id="discountGrantForm" class="settings-form">
    <label>ID пользователя
      <input name="userId" type="number" min="1" required>
    </label>

    <label>Скидка
      <div class="blup-select" data-name="percent" data-value="1">
        <button type="button" class="blup-select-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="blup-select-icon">%</span>
          <span class="blup-select-label">1%</span>
          <span class="blup-select-chevron"></span>
        </button>
        <ul class="blup-select-menu" role="listbox" tabindex="-1">
          <li role="option" data-value="1" data-icon="%" class="is-selected">
            <span class="opt-icon">%</span>
            <span class="opt-text"><b>1%</b><small>Базовая скидка</small></span>
          </li>
          <li role="option" data-value="3" data-icon="%">
            <span class="opt-icon">%</span>
            <span class="opt-text"><b>3%</b><small>Повышенная скидка</small></span>
          </li>
          <li role="option" data-value="0" data-icon="×">
            <span class="opt-icon">×</span>
            <span class="opt-text"><b>Убрать скидку</b><small>Сбросить до нуля</small></span>
          </li>
        </ul>
        <input type="hidden" name="percent" value="1">
      </div>
    </label>

    <button class="btn btn-primary">Применить</button>
  </form>
</section>
