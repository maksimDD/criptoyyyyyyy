<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLUP — Заявки Tournament</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><style>
.tadmin{width:min(1200px,calc(100% - 30px));margin:38px auto}.tadmin-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.tadmin table{width:100%;border-collapse:collapse;min-width:900px}.tadmin th,.tadmin td{text-align:left;padding:13px;border-bottom:1px solid #293451;font-size:12px;vertical-align:top}.tadmin a{color:#9d91ff}.tadmin .table-scroll{overflow:auto}.tadmin .back{color:#fff;text-decoration:none;border:1px solid #38435e;padding:10px 14px;border-radius:10px}
</style></head><body class="admin-body"><header class="admin-top"><a class="brand" href="/admin"><span class="brand-orb"></span><span>BLUP</span></a><span class="admin-top-label">TOURNAMENT APPLICATIONS</span><a class="back" href="/admin">← Назад в админку</a></header>
<main class="tadmin"><div class="admin-heading"><div><div class="eyebrow">ADMIN / TOURNAMENT</div><h1>Заявки на турниры</h1><p>Здесь отображаются ID аккаунта, пользователь и все данные из заявки.</p></div><button class="btn btn-outline btn-small" id="refresh">Обновить ↻</button></div>
<section class="admin-card table-card"><div class="table-scroll"><table><thead><tr><th>ID заявки</th><th>ID пользователя</th><th>Пользователь</th><th>Формат</th><th>Steam</th><th>Faceit</th><th>ELO</th><th>Telegram</th><th>Дата</th></tr></thead><tbody id="rows"><tr><td colspan="9">Загрузка…</td></tr></tbody></table></div></section><p id="error" class="admin-error"></p></main>
<script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const body=document.querySelector('#rows'),err=document.querySelector('#error');body.innerHTML='<tr><td colspan="9">Загрузка…</td></tr>';err.textContent='';try{const r=await fetch('/api/admin/tournament-applications');if(r.status===401||r.status===403){location.href='/admin';return}const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка');body.innerHTML=data.length?data.map(a=>`<tr><td><b>#${a.id}</b></td><td>${a.user_id}${a.public_id?' / '+a.public_id:''}</td><td>${esc(a.nickname)}</td><td>${a.category==='paid'?'$$$':'Free'}</td><td><a href="${esc(a.steam_url)}" target="_blank" rel="noopener">Открыть Steam ↗</a></td><td><a href="${esc(a.faceit_url)}" target="_blank" rel="noopener">Открыть Faceit ↗</a></td><td>${esc(a.elo)}</td><td>${esc(a.telegram)}</td><td>${esc(a.created_at)}</td></tr>`).join(''):'<tr><td colspan="9">Заявок пока нет</td></tr>'}catch(e){err.textContent=e.message;body.innerHTML=''}}document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
