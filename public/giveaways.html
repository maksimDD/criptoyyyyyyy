<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b12">
<title>Розыгрыши — BLUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/profile.css">
<style>
.giveaway-shell{width:min(1120px,calc(100% - 40px));margin:54px auto 90px}.giveaway-card{overflow:hidden;border:1px solid rgba(76,165,230,.24);border-radius:22px;background:linear-gradient(145deg,rgba(16,31,49,.96),rgba(7,14,25,.98));box-shadow:0 24px 80px #0006}.giveaway-banner{display:block;width:100%;height:auto;max-height:680px;object-fit:cover}.giveaway-content{padding:clamp(22px,4vw,42px)}.giveaway-kicker{font-size:10px;letter-spacing:.2em;font-weight:900;color:#42b9ff}.giveaway-content h1{font-size:clamp(26px,4vw,38px);margin:8px 0 20px;letter-spacing:-.04em}.giveaway-prizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 26px}.giveaway-prize{padding:16px;border:1px solid #ffffff18;border-radius:13px;background:#ffffff06}.giveaway-prize small{display:block;color:#8fa8bb;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:8px}.giveaway-prize b{font-size:14px}.giveaway-content h2{font-size:19px;margin:18px 0 10px}.giveaway-conditions{padding-left:22px;line-height:1.9;color:#c9d8e8}.giveaway-conditions a{color:#39baff;text-decoration:none;font-weight:800}.giveaway-conditions a:hover{text-decoration:underline}.giveaway-date{margin:22px 0;padding:15px 18px;border:1px solid #278ddd66;border-radius:12px;background:#0878c51a;color:#d7eaff;font-weight:800}.giveaway-action{display:flex;justify-content:center;margin-top:22px}.giveaway-action .btn{min-width:min(100%,320px);font-size:16px;padding:16px 26px;background:linear-gradient(110deg,#168ee8,#2456ca);box-shadow:0 10px 30px #147bd344}
@media(max-width:700px){.giveaway-shell{width:calc(100% - 24px);margin:28px auto 60px}.giveaway-prizes{grid-template-columns:1fr}.giveaway-prize{display:flex;justify-content:space-between;align-items:center;gap:12px}.giveaway-prize small{margin:0}.giveaway-banner{max-height:none}}

.giveaway-dynamic-prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:18px;margin:26px 0}
.giveaway-dynamic-prize{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-width:0;min-height:260px;padding:18px;border:1px solid rgba(100,190,255,.2);border-radius:20px;background:radial-gradient(ellipse at 50% 42%,rgba(22,137,224,.19),transparent 58%),linear-gradient(145deg,rgba(19,40,62,.78),rgba(7,17,30,.92));box-shadow:inset 0 1px 0 #ffffff0c,0 16px 36px #0003}
.giveaway-prize-art{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:205px;border-radius:15px;background:radial-gradient(ellipse at 50% 65%,rgba(29,159,255,.14),transparent 62%)}
.giveaway-prize-art:after{content:"";position:absolute;inset:12px;border:1px solid #8dd6ff12;border-radius:12px;pointer-events:none}
.giveaway-dynamic-prize img{position:relative;z-index:1;display:block;width:auto;height:auto;max-width:100%;max-height:235px;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.giveaway-dynamic-prize b{display:block;width:100%;margin:0;text-align:center;font-size:14px;font-weight:800;color:#e6f5ff;letter-spacing:.01em}
@media(max-width:650px){.giveaway-dynamic-prize{min-height:225px}.giveaway-prize-art{min-height:170px}.giveaway-dynamic-prize img{max-height:190px}}
.giveaway-description{white-space:pre-wrap;color:#b9c9d8;line-height:1.7;margin:12px 0 20px}
.giveaway-entries{margin-top:30px;border-top:1px solid #ffffff18;padding-top:22px}
.giveaway-entries h2{font-size:18px;margin-bottom:12px}
.giveaway-entry-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.giveaway-entry{padding:11px 13px;border:1px solid #ffffff14;border-radius:10px;background:#ffffff05;font-size:12px;display:flex;justify-content:space-between;gap:10px}
.giveaway-entry small{color:#85a5ba}
.giveaway-empty{padding:34px;text-align:center;color:#9bb3c5}
.giveaway-action .btn:disabled{opacity:.55;cursor:not-allowed}
@media(max-width:650px){.giveaway-prizes{grid-template-columns:1fr}}
</style></head>
<body class="profile-body"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<header class="header"><a class="brand" href="/" aria-label="BLUP — главная"><span class="brand-orb"></span><span>BLUP</span></a><nav class="nav"><a class="nav-link" href="/">Главная</a><a class="nav-link active" href="/giveaways">Розыгрыши</a></nav><div class="header-actions"><a class="btn btn-ghost btn-small" href="/profile">Профиль</a><a class="btn btn-ghost btn-small" href="/">На сайт ↗</a></div></header>
<main class="giveaway-shell"><article class="giveaway-card"><div class="giveaway-content" id="giveawayContent"><div class="giveaway-empty">Загружаем розыгрыш…</div></div></article></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(url,opts={})=>{const r=await fetch(url,{...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка');return d;};
function render(g){
 const root=document.getElementById('giveawayContent');
 if(!g){root.innerHTML='<div class="giveaway-empty"><h1>Сейчас розыгрышей нет</h1><p>Следи за обновлениями BLUP — новые розыгрыши появятся здесь.</p></div>';return;}
 const done=g.status==='finished';
 root.innerHTML=`<div class="giveaway-kicker">BLUP / GIVEAWAY</div><h1>${esc(g.title)}</h1>
 <div class="giveaway-description">${esc(g.description||'')}</div>
 <div class="giveaway-prizes"><div class="giveaway-prize"><small>Условие участия</small><b>${Number(g.minimum_sales)>0?'Продажи от $'+Number(g.minimum_sales).toFixed(2):'Бесплатно для всех'}</b></div><div class="giveaway-prize"><small>Количество мест</small><b>${g.winner_slots}</b></div><div class="giveaway-prize"><small>Участники</small><b>${g.entries.length}</b></div></div>
 ${g.prizes.length?`<div class="giveaway-dynamic-prizes">${g.prizes.map(p=>`<div class="giveaway-dynamic-prize"><div class="giveaway-prize-art"><img src="${p.image_data}" alt="${esc(p.caption||'Приз')}"></div><b>${esc(p.caption||'Приз')}</b></div>`).join('')}</div>`:''}
 <div class="giveaway-date">${done?'ИТОГИ ПОДВЕДЕНЫ':'РОЗЫГРЫШ АКТИВЕН'}</div>
 <div class="giveaway-action"><button class="btn btn-primary" id="participate" ${done?'disabled':''}>${done?'Розыгрыш завершён':'Участвовать'}</button><p class="giveaway-message" id="giveawayMessage" style="margin-top:12px;color:#a9c8dd"></p></div>
 ${done?`<div class="giveaway-entries"><h2>Победители</h2><div class="giveaway-entry-list">${(g.winners||[]).map(w=>`<div class="giveaway-entry"><b>${w.place} место · ${esc(w.nickname)}</b><small>ID #${esc(w.public_id)}</small></div>`).join('')||'Победителей нет'}</div></div>`:''}
 <div class="giveaway-entries"><h2>Участники · ник и ID сайта</h2><div class="giveaway-entry-list">${g.entries.map(u=>`<div class="giveaway-entry"><b>${esc(u.nickname)}</b><small>ID #${esc(u.public_id)}</small></div>`).join('')||'<span class="giveaway-empty">Пока никто не участвует</span>'}</div></div>`;
 document.getElementById('participate')?.addEventListener('click',async()=>{
  const b=document.getElementById('participate'),m=document.getElementById('giveawayMessage');b.disabled=true;m.textContent='Проверяем условия…';
  try{await api(`/api/giveaways/${g.id}/participate`,{method:'POST',body:'{}'});m.textContent='Ты успешно участвуешь!';const fresh=await api('/api/giveaways/current');render(fresh.giveaway);}
  catch(e){m.textContent=e.message;b.disabled=false;}
 });
}
api('/api/giveaways/current').then(d=>render(d.giveaway)).catch(e=>document.getElementById('giveawayContent').innerHTML=`<div class="giveaway-empty">${esc(e.message)}</div>`);
</script></body></html>
