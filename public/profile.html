<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>BLUP — Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/profile.css">
</head>
<body class="profile-body">
<div class="online-widget" id="onlineBadge" title="Сейчас на сайте">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%235ce3a4' d='M12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.3 5.3a6.6 6.6 0 0 1 0-9.6l1.4 1.4a4.7 4.7 0 0 0 0 6.8l-1.4 1.4zm6.6 0l-1.4-1.4a4.7 4.7 0 0 0 0-6.8l1.4-1.4a6.6 6.6 0 0 1 0 9.6zM5.9 18.1a9.4 9.4 0 0 1 0-14.2l1.4 1.4a7.5 7.5 0 0 0 0 11.4l-1.4 1.4zm12.2 0l-1.4-1.4a7.5 7.5 0 0 0 0-11.4l1.4-1.4a9.4 9.4 0 0 1 0 14.2z'/></svg>" alt="online" class="online-img">
      <div class="online-text">
<header class="header">
  <a class="brand" href="/" aria-label="BLUP — главная"><span class="brand-orb"></span><span>BLUP</span></a>
  <nav class="nav" id="nav">
    <a class="nav-link" href="/">Главная</a>
    <a class="nav-link active" href="/profile">Профиль</a>
  </nav>
  <div class="header-actions">
    <a class="btn btn-ghost btn-small" href="/">На сайт ↗</a>
    <button class="btn btn-outline btn-small" id="p-logout">Выйти</button>
  </div>
</header>

<main class="profile-shell">
  <div class="profile-error" id="p-error"></div>

  <section class="profile-card">
    <div class="profile-head">
      <div class="profile-avatar-wrap">
        <img id="p-avatar" class="profile-avatar" alt="Аватар Telegram" referrerpolicy="no-referrer">
        <div id="p-avatar-fallback" class="profile-avatar-fallback" style="display:none">B</div>
      </div>
      <div class="profile-head-info">
        <span class="profile-eyebrow">BLUP / PROFILE</span>
        <h1 id="p-nick">Загрузка…</h1>
        <div class="profile-meta">
          <span id="p-public-id" class="pill">#—</span>
          <span id="p-tg-username" class="pill pill-tg">@—</span>
        </div>
      </div>
    </div>

    <div class="profile-grid">
      <div class="profile-item">
        <small>Telegram ID</small>
        <b id="p-tg-id">—</b>
      </div>
      <div class="profile-item">
        <small>Имя в Telegram</small>
        <b id="p-tg-name">—</b>
      </div>
      <div class="profile-item">
        <small>Постоянная скидка</small>
        <b id="p-discount">—</b>
      </div>
      <div class="profile-item">
        <small>Продано (completed)</small>
        <b id="p-sold">—</b>
      </div>
      <div class="profile-item">
        <small>На сайте с</small>
        <b id="p-created">—</b>
      </div>
    </div>
  </section>

  <section class="profile-card">
    <div class="profile-card-head">
      <span class="profile-eyebrow">ОДНОРАЗОВЫЕ КУПОНЫ</span>
      <h2>Активные скидки</h2>
      <p class="muted">Купон сгорает после применения в продаже.</p>
    </div>
    <div id="p-coupons" class="coupon-list">
      <p class="muted">Загрузка…</p>
    </div>
  </section>
</main>

<script src="/profile.js"></script>
</body>
</html>
